name: rejection-ledger
version: "1.0.0"
description: "拒绝账本 — 跟踪被拒绝的工具调用，多次拒绝后自动暂停自主运行"
kind: backend
provides_tools:
  - rejection_ledger_stats
  - rejection_ledger_recent
  - rejection_ledger_check
hooks:
  - post_tool_call
config:
  max_consecutive_rejections: 3
  window_size: 20
  auto_pause: true
  cooldown_seconds: 300
